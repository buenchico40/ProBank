name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore src/ProBank.sln
      - run: dotnet build src/ProBank.sln --no-restore -c Release
      - run: dotnet build src/ProBank.Database/ProBank.Database.sqlproj -c Release
      - run: dotnet test test/ProBank.Tests.sln -c Release --filter "Category!=Integration" --logger trx
      - run: dotnet test test/ProBank.Tests.sln -c Release --filter "Category=Integration"
      - uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: src/ProBank.Database/bin/Release/*.dacpac
